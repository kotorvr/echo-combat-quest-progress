<script>
(function(){
var d=document,B=d.body,API=B.getAttribute('data-notes')||'',POSE=B.getAttribute('data-pose'),VER=B.getAttribute('data-ver');
function $(i){return d.getElementById(i);}
var ph=$('ph'),ia=$('ia'),ib=$('ib'),mk=$('mk'),hd=$('hd'),sa=$('sa'),sb=$('sb'),pv=$('pv'),nx=$('nx'),zr=$('zr'),zo=$('zo'),ln=$('ln');
var IW=1280,IH=800,MAXZ=8,MAXC=8,z=1,px=0,py=0,x0=0,y0=0,w0=1,h0=1,split=50,mine=[],notes=[],marking=false,hot=-1;
var layers=[ia,mk];if(ib)layers.push(ib);
function fit(){var W=ph.clientWidth,H=ph.clientHeight,k=Math.min(W/IW,H/IH);w0=IW*k;h0=IH*k;x0=(W-w0)/2;y0=(H-h0)/2;apply();}
function apply(){
 z=Math.max(1,Math.min(MAXZ,z));px=Math.min(0,Math.max(w0*(1-z),px));py=Math.min(0,Math.max(h0*(1-z),py));
 layers.forEach(function(el){var s=el.style;s.left=x0+'px';s.top=y0+'px';s.width=w0+'px';s.height=h0+'px';
  s.transform='translate('+px.toFixed(1)+'px,'+py.toFixed(1)+'px) scale('+z.toFixed(4)+')';});
 zr.textContent=Math.round(z*100)+'%';zo.disabled=z<=1;
 if(ln){var a=Math.max(0,y0+py),b=Math.max(0,ph.clientHeight-(y0+py+h0*z));ln.style.top=a+'px';ln.style.bottom=b+'px';}
 setSplit(split);}
function zoomAt(cx,cy,nz){nz=Math.max(1,Math.min(MAXZ,nz));var k=nz/z;px=(cx-x0)-((cx-x0)-px)*k;py=(cy-y0)-((cy-y0)-py)*k;z=nz;apply();}
function reset(){z=1;px=py=0;apply();}
function pt(e){var b=ph.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top];}
function toImg(p){return {x:((p[0]-x0-px)/z)/w0,y:((p[1]-y0-py)/z)/h0};}
function setSplit(v){split=Math.max(0,Math.min(100,v));ph.style.setProperty('--x',split+'%');
 if(!hd)return;hd.setAttribute('aria-valuenow',Math.round(split));
 var pw=ph.clientWidth,sx=pw*split/100;sa.hidden=sx<150;sb.hidden=sx>pw-sb.clientWidth-90;}
function setSize(){IW=ia.naturalWidth||IW;IH=ia.naturalHeight||IH;mk.setAttribute('viewBox','0 0 '+IW+' '+IH);fit();draw();}
if(ia.complete)setSize();ia.addEventListener('load',setSize);
ph.addEventListener('wheel',function(e){
 e.preventDefault();var p=pt(e),u=e.deltaMode===1?33:e.deltaMode===2?400:1;
 zoomAt(p[0],p[1],z*Math.exp(-Math.max(-300,Math.min(300,e.deltaY*u))*0.0016));},{passive:false});
ph.addEventListener('dblclick',function(e){if(marking||e.target===hd)return;var p=pt(e);if(z>1)reset();else zoomAt(p[0],p[1],2.5);});
zo.addEventListener('click',reset);window.addEventListener('resize',fit);
if(hd){
 var hdOn=false;
 hd.addEventListener('pointerdown',function(e){e.stopPropagation();hdOn=true;try{hd.setPointerCapture(e.pointerId);}catch(x){}});
 hd.addEventListener('pointermove',function(e){if(hdOn)setSplit(pt(e)[0]/ph.clientWidth*100);});
 function hdUp(){hdOn=false;}
 hd.addEventListener('pointerup',hdUp);hd.addEventListener('pointercancel',hdUp);
 hd.addEventListener('dblclick',function(e){e.stopPropagation();});
 hd.addEventListener('keydown',function(e){
  if(e.key==='ArrowLeft'){setSplit(split-2);e.stopPropagation();e.preventDefault();}
  if(e.key==='ArrowRight'){setSplit(split+2);e.stopPropagation();e.preventDefault();}});
}
var ps={},d0=0,z0=1,cur=null;
function two(){var k=Object.keys(ps);return k.length===2?[ps[k[0]],ps[k[1]]]:null;}
function dist(t){return Math.hypot(t[0][0]-t[1][0],t[0][1]-t[1][1])||1;}
ph.addEventListener('pointerdown',function(e){
 if(e.pointerType==='mouse'&&e.button!==0)return;
 var p=pt(e);ps[e.pointerId]=p;try{ph.setPointerCapture(e.pointerId);}catch(x){}
 var t=two();
 if(t){d0=dist(t);z0=z;if(cur){mine.pop();cur=null;draw();}}
 else if(marking){if(mine.length<MAXC){var q=toImg(p);cur={x:q.x,y:q.y,r:0};mine.push(cur);}}
 else ph.classList.add('pan');});
ph.addEventListener('pointermove',function(e){
 var o=ps[e.pointerId];if(!o)return;var p=pt(e),t;ps[e.pointerId]=p;t=two();
 if(t)zoomAt((t[0][0]+t[1][0])/2,(t[0][1]+t[1][1])/2,z0*dist(t)/d0);
 else if(cur){var q=toImg(p),dx=(q.x-cur.x)*IW,dy=(q.y-cur.y)*IH;cur.r=Math.sqrt(dx*dx+dy*dy)/IW;draw();}
 else if(!marking){px+=p[0]-o[0];py+=p[1]-o[1];apply();}});
function up(e){
 if(!ps[e.pointerId])return;delete ps[e.pointerId];ph.classList.remove('pan');
 if(cur){if(e.type!=='pointerup'||cur.r<0.008||cur.x<0||cur.x>1||cur.y<0||cur.y>1)mine.pop();
  else{cur.x=+cur.x.toFixed(4);cur.y=+cur.y.toFixed(4);cur.r=+Math.min(0.5,cur.r).toFixed(4);}
  cur=null;draw();sync();}}
ph.addEventListener('pointerup',up);ph.addEventListener('pointercancel',up);
function ring(c,cls){var el=d.createElementNS(mk.namespaceURI,'circle');
 el.setAttribute('cx',c.x*IW);el.setAttribute('cy',c.y*IH);el.setAttribute('r',Math.max(1,c.r*IW));el.setAttribute('class',cls);
 mk.appendChild(el);}
function draw(){
 while(mk.firstChild)mk.removeChild(mk.firstChild);
 notes.forEach(function(n,i){n.circles.forEach(function(c){ring(c,'theirs'+(i===hot?' hot':''));});});
 mine.forEach(function(c){ring(c,'mine');});}
var circ=$('circ'),undo=$('undo'),tx=$('tx'),bt=$('bt'),f=$('f'),list=$('list'),msg=$('msg'),none=$('none');
var HINT='Public. Your red circles are posted with the note.';
function say(s){msg.textContent=s;}
function sync(){
 undo.disabled=!mine.length;bt.disabled=!(tx.value.trim()||mine.length);
 say(mine.length?'Public. '+mine.length+' red circle'+(mine.length>1?'s':'')+' will be posted with it.':HINT);
 try{if(tx.value||mine.length)sessionStorage.setItem('spot:draft:'+POSE,JSON.stringify({t:tx.value,c:mine,v:VER}));
  else sessionStorage.removeItem('spot:draft:'+POSE);}catch(e){}}
circ.addEventListener('click',function(){marking=!marking;circ.setAttribute('aria-pressed',marking);ph.classList.toggle('marking',marking);});
undo.addEventListener('click',function(){mine.pop();draw();sync();});
tx.addEventListener('input',sync);
function num(v,lo,hi){v=Number(v);return v>=lo&&v<=hi?v:null;}
function rings(a){var o=[];if(!Array.isArray(a))return o;
 a.slice(0,MAXC).forEach(function(c){if(!c)return;var x=num(c.x,0,1),y=num(c.y,0,1),r=num(c.r,0.005,0.5);
  if(x!==null&&y!==null&&r!==null)o.push({x:x,y:y,r:r});});return o;}
function row(o,i){
 var li=d.createElement('li'),m=d.createElement('span'),n=o.circles.length;
 li.textContent=String(o.note||'(circles only)');
 m.textContent='#'+Number(o.id)+' · '+String(o.day).slice(0,10)+(n?' · '+n+' circle'+(n>1?'s':''):'');
 li.appendChild(m);
 li.addEventListener('mouseenter',function(){hot=notes.indexOf(o);draw();});
 li.addEventListener('mouseleave',function(){hot=-1;draw();});
 return li;}
function show(){
 while(list.firstChild)list.removeChild(list.firstChild);
 notes.forEach(function(o){list.appendChild(row(o));});
 $('n1').textContent=notes.length;$('n2').textContent=notes.length;none.hidden=notes.length>0;draw();}
function take(o){var old=o.ver!==VER;return {id:o.id,day:o.day,note:o.note,old:old,circles:old?[]:rings(o.circles)};}
var C=null;
function stash(){try{sessionStorage.setItem('spot:notes',JSON.stringify(C));}catch(e){}}
function fill(){
 notes=C.a.filter(function(o){return o&&o.pose===POSE&&(o.note||(o.circles&&o.circles.length));})
  .sort(function(x,y){return y.id-x.id;}).map(take);show();}
function busy(){none.hidden=true;$('lead').textContent='The notes are busy right now. Try again in a minute.';}
try{var dr=JSON.parse(sessionStorage.getItem('spot:draft:'+POSE)||'null');
 if(dr){tx.value=String(dr.t||'').slice(0,500);if(dr.v===VER)mine=rings(dr.c);}}catch(e){}
if(!API){f.hidden=true;none.hidden=true;$('lead').textContent='Notes are switched off at the moment.';}
else{
 try{var c=JSON.parse(sessionStorage.getItem('spot:notes')||'null');
  if(c&&Array.isArray(c.a)&&Date.now()-c.at>=0&&Date.now()-c.at<45000)C=c;}catch(e){}
 if(C)fill();
 else fetch(API).then(function(r){if(!r.ok)throw 0;return r.text();}).then(function(s){
  var a=JSON.parse(s);if(!Array.isArray(a))throw 0;C={at:Date.now(),a:a};stash();fill();
 }).catch(busy);
 f.addEventListener('submit',function(e){
  e.preventDefault();var t=tx.value.replace(/\s+/g,' ').trim(),cs=mine.slice();
  if(!t&&!cs.length)return;
  bt.disabled=true;say('Posting...');
  fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({pose:POSE,ver:VER,t:null,circles:cs,note:t})}).then(function(r){
   return r.text().then(function(s){var j={};try{j=JSON.parse(s)||{};}catch(x){}return [r.status,j];});}).then(function(a){
   if(a[0]===201){var o={id:a[1].id,pose:POSE,note:t,ver:VER,circles:cs,day:new Date().toISOString().slice(0,10)};
    if(C){C.a.push(o);stash();}
    notes.unshift(take(o));mine=[];tx.value='';show();sync();say('Posted. Thank you.');return;}
   bt.disabled=false;
   if(a[0]===429)say('Too many notes just now. Try again later.');
   else if(a[0]===503)say('The notes are busy right now. Try again in a minute.');
   else if(a[0]===400&&/links/.test(a[1].error||''))say('Plain text only: no links or addresses.');
   else if(a[0]===400||a[0]===413)say('That note cannot be posted (500 characters at most, plain text).');
   else say('Could not post. Try again in a minute.');
  }).catch(function(){bt.disabled=false;say('Could not post. Try again in a minute.');});});
}
$('hide').addEventListener('click',function(){B.classList.add('nopanel');fit();});
$('ptog').addEventListener('click',function(){B.classList.remove('nopanel');fit();});
function go(a){if(a&&a.href)location.href=a.href;}
d.addEventListener('keydown',function(e){
 var g=e.target.tagName;if(g==='TEXTAREA'||g==='INPUT'||g==='BUTTON'||e.ctrlKey||e.metaKey||e.altKey)return;
 if(e.key==='ArrowLeft')go(pv);else if(e.key==='ArrowRight')go(nx);else if(e.key==='Escape')reset();
 else if(e.key==='+'||e.key==='=')zoomAt(ph.clientWidth/2,ph.clientHeight/2,z*1.4);
 else if(e.key==='-')zoomAt(ph.clientWidth/2,ph.clientHeight/2,z/1.4);});
fit();draw();sync();
})();
